name: Scheduled jobs (manual / fallback)

# Scheduling is done by Supabase pg_cron (supabase/migrations/20261031000100_pg_cron_triggers.sql),
# which is free, minute-level and more dependable than GitHub's best-effort cron. This workflow is
# kept ONLY for manual runs (Actions -> Run workflow) and as a fallback scheduler.
#
# Do NOT enable the schedule below while pg_cron is active: every job would run twice.
# To switch back to GitHub scheduling, `select cron.unschedule(jobid) from cron.job where
# jobname like 'ttml-%';` in Supabase, then uncomment the schedule block.
#
# Required repository secrets:
#   APP_URL      e.g. https://www.talk-to-my-lawyer.com
#   CRON_SECRET  same value as the CRON_SECRET env var on the Vercel project

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  #   - cron: "*/15 * * * *"
  #   - cron: "0 * * * *"
  #   - cron: "30 * * * *"
  #   - cron: "0 */6 * * *"
  #   - cron: "0 3 * * *"
  #   - cron: "0 4 * * *"
  #   - cron: "0 2 * * 0"
  #   - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: "Run one job by name (e.g. draft-reminders) or 'drain'"
        required: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Don't stack runs of the same schedule if one is slow.
    concurrency:
      group: cron-${{ github.event.schedule || inputs.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/trigger-cron.sh
          sparse-checkout-cone-mode: false
      - name: Trigger
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            bash scripts/trigger-cron.sh "$SCHEDULE"
          else
            bash scripts/trigger-cron.sh "job:$JOB"
          fi
